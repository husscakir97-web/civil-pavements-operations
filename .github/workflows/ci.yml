name: Hostinger migration checks
on:
  push:
    branches: [main, hostinger-migration]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: migration_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency security audit (fails on high/critical production vulnerabilities or a scanner failure)
        run: npm run security:audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Match Hostinger production-only dependency installation
        run: npm prune --omit=dev
      - run: npm run build
      - name: Standalone artifact startup with source checkout unavailable
        run: node scripts/test-standalone-artifact.mjs .next/standalone --hide-source
      - name: MySQL migrations and production integration
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: migration_test
          MYSQL_USER: root
          MYSQL_PASSWORD: integration-only
        run: |
          npm run test:fresh
          npm run test:migration-recovery
          npm run db:migrate
          npm run knowledge:import-platform -- knowledge/platform/example.synthetic.json
          npm run test:backfill
          npm run test:mysql
          npm run test:v1
      - name: Demonstration importer suite (isolated disposable databases)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: integration-only
        run: |
          mysql -h 127.0.0.1 -uroot -pintegration-only -e "CREATE DATABASE import_check_test CHARACTER SET utf8mb4; CREATE DATABASE import_review_test CHARACTER SET utf8mb4;"
          MYSQL_DATABASE=import_check_test npm run test:import-demo
          MYSQL_DATABASE=import_review_test npm run test:import-review
      - name: Hosted-import path suites (existing tenant + staging, incl. maintenance freeze and SIGKILL interruption/resume; disposable databases)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: integration-only
        run: |
          mysql -h 127.0.0.1 -uroot -pintegration-only -e "CREATE DATABASE existing_tenant_check_test CHARACTER SET utf8mb4; CREATE DATABASE staging_path_check_test CHARACTER SET utf8mb4;"
          MYSQL_DATABASE=existing_tenant_check_test npm run test:existing-tenant
          MYSQL_DATABASE=staging_path_check_test npm run test:staging-path
      - name: Standalone MySQL concurrency, maintenance, interruption and resume (copied artifact)
        timeout-minutes: 35
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: integration-only
          MYSQL_DATABASE: standalone_existing_tenant_test
        run: |
          mysql -h 127.0.0.1 -uroot -pintegration-only -e "CREATE DATABASE standalone_existing_tenant_test CHARACTER SET utf8mb4;"
          node scripts/test-standalone-mysql.mjs
