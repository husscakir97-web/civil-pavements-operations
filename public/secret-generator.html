<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>Generate your auth secret</title><style>body{font:18px system-ui;max-width:720px;margin:8vh auto;padding:24px;line-height:1.6}button{font:inherit;padding:10px 20px;margin:8px 8px 8px 0;cursor:pointer}textarea{width:100%;box-sizing:border-box;font:16px monospace;padding:12px;height:110px}small{color:#444}</style><h1>Generate your auth secret</h1><p>This page creates a random secret entirely in your browser. Nothing is sent or saved.</p><button id="generate">Generate secret</button><label for="secret">BETTER_AUTH_SECRET</label><textarea id="secret" readonly spellcheck="false" aria-label="Generated auth secret"></textarea><button id="copy" disabled>Copy</button><p id="status" role="status"></p><small>Paste into Hostinger environment variables and your password manager. Keep it private. Keep the same secret when redeploying.</small><script>
const output=document.getElementById('secret'),status=document.getElementById('status'),copy=document.getElementById('copy');
document.getElementById('generate').onclick=()=>{const bytes=crypto.getRandomValues(new Uint8Array(32));output.value=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');copy.disabled=false;status.textContent='Generated 64 characters. Copy and save the value before closing this page.';};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent='Copied. Paste into BETTER_AUTH_SECRET in hPanel.';}catch{output.select();status.textContent='Select Copy from your browser menu, or press Ctrl+C / Command+C.';}};
</script></html>
